<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFBBot - Facebook Messenger Bot Platform</title>
    <link rel="icon" type="image/x-icon" href="https://l.top4top.io/p_3203n4uzy0.jpeg">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--gray);
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            text-decoration: none;
            color: var(--dark);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-btn.primary {
            background: var(--gradient);
            color: white;
        }

        .nav-btn.primary:hover {
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* Main Content */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card-header {
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--gray);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Features Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .feature-card {
            padding: 25px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .feature-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .feature-description {
            font-size: 14px;
            color: var(--gray);
            line-height: 1.6;
        }

        /* Stats */
        .stats-wrapper {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--gray);
            margin-top: 5px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        /* Loading Animation */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .nav-btn {
                width: 100%;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [formData, setFormData] = useState({
                prefix: '',
                adminUID: '',
                appstate: ''
            });
            const [agreed, setAgreed] = useState(false);
            const [commands, setCommands] = useState([{ commands: [] }, { handleEvent: [] }]);
            const [stats, setStats] = useState({ ping: 0, time: '' });

            useEffect(() => {
                // Show welcome alert
                Swal.fire({
                    title: 'Welcome to AutoFBBot! 🤖',
                    html: `
                        <p style="text-align: left; line-height: 1.8;">
                            <strong>🔒 Privacy Notice:</strong><br>
                            Upon deployment, your chatbot remains active unless you access the account or change the password.<br><br>
                            <strong>📊 Data Collection:</strong><br>
                            We collect Facebook public profile data to improve user experience. Your information is never shared with third parties.<br><br>
                            <strong>📞 Support:</strong><br>
                            Need help? Contact us on <a href="https://www.facebook.com/jaymar.dev.00" target="_blank" style="color: #667eea;">Facebook</a>
                        </p>
                    `,
                    icon: 'info',
                    confirmButtonText: 'Got it!',
                    confirmButtonColor: '#667eea',
                    background: '#fff',
                    backdrop: 'rgba(0,0,0,0.4)'
                });

                // Fetch commands
                fetch('/commands')
                    .then(res => res.json())
                    .then(data => {
                        setCommands([
                            { commands: data.commands },
                            { handleEvent: data.handleEvent }
                        ]);
                    })
                    .catch(err => console.error('Error fetching commands:', err));

                // Update time and ping
                const updateStats = () => {
                    const now = new Date();
                    const options = {
                        timeZone: 'Asia/Manila',
                        hour12: true,
                        hour: 'numeric',
                        minute: 'numeric',
                        second: 'numeric'
                    };
                    setStats(prev => ({
                        ...prev,
                        time: now.toLocaleString('en-US', options)
                    }));
                };

                const measurePing = () => {
                    const start = Date.now();
                    fetch(location.href + '?t=' + Date.now())
                        .then(() => {
                            setStats(prev => ({
                                ...prev,
                                ping: Date.now() - start
                            }));
                        })
                        .catch(() => {});
                };

                updateStats();
                measurePing();
                const interval = setInterval(() => {
                    updateStats();
                    measurePing();
                }, 1000);

                return () => clearInterval(interval);
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!formData.adminUID || !formData.appstate) {
                    Swal.fire({
                        title: 'Missing Information',
                        text: 'Please fill in Admin UID and Appstate',
                        icon: 'error',
                        confirmButtonColor: '#ef4444'
                    });
                    return;
                }

                if (!agreed) {
                    Swal.fire({
                        title: 'Terms Required',
                        text: 'Please agree to the terms and policies',
                        icon: 'warning',
                        confirmButtonColor: '#f59e0b'
                    });
                    return;
                }

                try {
                    Swal.fire({
                        title: 'Processing...',
                        text: 'Setting up your bot',
                        icon: 'info',
                        allowOutsideClick: false,
                        showConfirmButton: false,
                        didOpen: () => Swal.showLoading()
                    });

                    const state = JSON.parse(formData.appstate);
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            state: state,
                            commands: commands,
                            prefix: formData.prefix || '.',
                            admin: formData.adminUID
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        Swal.fire({
                            title: 'Success! 🎉',
                            text: data.message,
                            icon: 'success',
                            confirmButtonColor: '#10b981'
                        });
                        setFormData({ prefix: '', adminUID: '', appstate: '' });
                        setAgreed(false);
                    } else {
                        Swal.fire({
                            title: 'Error',
                            text: data.message,
                            icon: 'error',
                            confirmButtonColor: '#ef4444'
                        });
                    }
                } catch (error) {
                    Swal.fire({
                        title: 'Invalid Data',
                        text: 'Please check your appstate JSON format',
                        icon: 'error',
                        confirmButtonColor: '#ef4444'
                    });
                }
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="logo">
                            <div className="logo-icon">
                                <i className="fas fa-robot"></i>
                            </div>
                            <div className="logo-text">
                                <h1>AutoFBBot</h1>
                                <p>Facebook Messenger Automation</p>
                            </div>
                        </div>
                        <nav className="nav-links">
                            <a href="/" className="nav-btn">Home</a>
                            <a href="/step_by_step_guide" className="nav-btn">Guide</a>
                            <a href="/online_user" className="nav-btn primary">Active Bots</a>
                        </nav>
                    </header>

                    <div className="main-grid">
                        <div className="card">
                            <div className="card-header">
                                <h2 className="card-title">Deploy Your Bot</h2>
                                <p className="card-subtitle">Connect your Facebook account and start automating</p>
                            </div>

                            <form onSubmit={handleSubmit}>
                                <div className="form-group">
                                    <label className="form-label">
                                        <i className="fas fa-terminal"></i> Bot Prefix (optional)
                                    </label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        placeholder="e.g., . $ # @ !"
                                        value={formData.prefix}
                                        onChange={(e) => setFormData({...formData, prefix: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">
                                        <i className="fas fa-user-shield"></i> Admin UID *
                                    </label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        placeholder="1000xxxxxxxxxx"
                                        value={formData.adminUID}
                                        onChange={(e) => setFormData({...formData, adminUID: e.target.value})}
                                        required
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">
                                        <i className="fas fa-code"></i> Facebook Appstate *
                                    </label>
                                    <textarea
                                        className="form-input form-textarea"
                                        placeholder='[{"key":"c_user","value":"..."}]'
                                        value={formData.appstate}
                                        onChange={(e) => setFormData({...formData, appstate: e.target.value})}
                                        required
                                    />
                                </div>

                                <div className="checkbox-wrapper">
                                    <input
                                        type="checkbox"
                                        className="checkbox-input"
                                        id="agree"
                                        checked={agreed}
                                        onChange={(e) => setAgreed(e.target.checked)}
                                    />
                                    <label htmlFor="agree" className="form-label" style={{margin: 0}}>
                                        I agree to the terms and privacy policy
                                    </label>
                                </div>

                                <button type="submit" className="submit-btn" disabled={!agreed}>
                                    <i className="fas fa-rocket"></i> Deploy Bot
                                </button>
                            </form>

                            <div className="stats-wrapper">
                                <div className="stat-item">
                                    <div className="stat-value">{stats.ping}ms</div>
                                    <div className="stat-label">Ping</div>
                                </div>
                                <div className="stat-item">
                                    <div className="stat-value" style={{fontSize: '14px'}}>{stats.time}</div>
                                    <div className="stat-label">Server Time (GMT+8)</div>
                                </div>
                            </div>
                        </div>

                        <div className="card">
                            <div className="card-header">
                                <h2 className="card-title">Features</h2>
                                <p className="card-subtitle">Powerful automation at your fingertips</p>
                            </div>

                            <div className="features-grid">
                                <div className="feature-card">
                                    <div className="feature-icon" style={{background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white'}}>
                                        <i className="fas fa-robot"></i>
                                    </div>
                                    <div className="feature-title">AI Integration</div>
                                    <div className="feature-description">GPT-4, Gemini Vision & more AI models</div>
                                </div>

                                <div className="feature-card">
                                    <div className="feature-icon" style={{background: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', color: 'white'}}>
                                        <i className="fas fa-music"></i>
                                    </div>
                                    <div className="feature-title">Media Tools</div>
                                    <div className="feature-description">Spotify downloads, image generation</div>
                                </div>

                                <div className="feature-card">
                                    <div className="feature-icon" style={{background: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', color: 'white'}}>
                                        <i className="fas fa-shield-alt"></i>
                                    </div>
                                    <div className="feature-title">Auto Protection</div>
                                    <div className="feature-description">Anti-leave, welcome messages</div>
                                </div>

                                <div className="feature-card">
                                    <div className="feature-icon" style={{background: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', color: 'white'}}>
                                        <i className="fas fa-clock"></i>
                                    </div>
                                    <div className="feature-title">Scheduled Posts</div>
                                    <div className="feature-description">Auto-posting quotes & verses</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <footer className="footer">
                        <p>Made with ❤️ by <a href="https://www.facebook.com/jaymar.dev.00" target="_blank">Jay Mar</a> • Powered by biar-fca</p>
                        <p style="opacity: 0.8; font-size: 12px; margin-top: 5px;">© 2025 AutoFBBot. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
