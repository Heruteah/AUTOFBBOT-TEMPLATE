<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Bots - AutoFBBot</title>
    <link rel="icon" href="https://i.imgur.com/BNKq0fl.jpeg" type="image/jpeg">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --success: #10b981;
            --dark: #1e293b;
            --gray: #64748b;
            --border: #e2e8f0;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .nav-btn.primary {
            background: var(--gradient);
            color: white;
        }

        .content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bot-count {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.2));
            border-radius: 10px;
            font-weight: 600;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        .bots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .bot-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 2px solid var(--border);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        .bot-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .bot-avatar {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 3px solid var(--border);
        }

        .bot-info {
            flex: 1;
        }

        .bot-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .bot-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.2));
            color: var(--success);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .bot-details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: var(--gray);
            font-size: 14px;
        }

        .detail-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--dark);
        }

        .profile-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
        }

        .profile-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 64px;
            color: var(--gray);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .empty-text {
            color: var(--gray);
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .nav-btn {
                text-align: center;
            }

            .content {
                padding: 25px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .bots-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function OnlineApp() {
            const [bots, setBots] = useState([]);
            const [loading, setLoading] = useState(true);

            const formatTime = (seconds) => {
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                
                if (hours > 0) {
                    return `${hours}h ${minutes}m ${secs}s`;
                } else if (minutes > 0) {
                    return `${minutes}m ${secs}s`;
                } else {
                    return `${secs}s`;
                }
            };

            const fetchBots = async () => {
                try {
                    const response = await fetch('/info');
                    const data = await response.json();
                    setBots(data);
                    setLoading(false);
                } catch (error) {
                    console.error('Error fetching bots:', error);
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchBots();
                const interval = setInterval(fetchBots, 5000); // Update every 5 seconds
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="container">
                    <header className="header">
                        <div className="logo">
                            <div className="logo-icon">
                                <i className="fas fa-signal"></i>
                            </div>
                            <div className="logo-text">
                                <h1>Active Bots</h1>
                            </div>
                        </div>
                        <nav className="nav-links">
                            <a href="/" className="nav-btn">Home</a>
                            <a href="/step_by_step_guide" className="nav-btn">Guide</a>
                            <a href="/online_user" className="nav-btn primary">Active Bots</a>
                        </nav>
                    </header>

                    <div className="content">
                        <div className="page-header">
                            <h1 className="page-title">Currently Active Bots</h1>
                            <div className="bot-count">
                                <div className="pulse-dot"></div>
                                <span>{bots.length} Bot{bots.length !== 1 ? 's' : ''} Online</span>
                            </div>
                        </div>

                        {loading ? (
                            <div className="loading">
                                <div className="spinner"></div>
                                <p style={{color: 'var(--gray)'}}>Loading active bots...</p>
                            </div>
                        ) : bots.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-icon">
                                    <i className="fas fa-robot"></i>
                                </div>
                                <h2 className="empty-title">No Active Bots</h2>
                                <p className="empty-text">
                                    Deploy your first bot from the <a href="/" style={{color: 'var(--primary)'}}>homepage</a>
                                </p>
                            </div>
                        ) : (
                            <div className="bots-grid">
                                {bots.map((bot, index) => (
                                    <div key={index} className="bot-card">
                                        <div className="bot-header">
                                            <img 
                                                src={bot.thumbSrc} 
                                                alt={bot.name}
                                                className="bot-avatar"
                                            />
                                            <div className="bot-info">
                                                <div className="bot-name">{bot.name}</div>
                                                <div className="bot-status">
                                                    <div className="pulse-dot" style={{width: '8px', height: '8px'}}></div>
                                                    Online
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bot-details">
                                            <div className="detail-row">
                                                <div className="detail-label">
                                                    <i className="fas fa-clock"></i>
                                                    Uptime
                                                </div>
                                                <div className="detail-value">{formatTime(bot.time)}</div>
                                            </div>
                                            
                                            <div className="detail-row" style={{flexDirection: 'column', alignItems: 'flex-start', gap: '5px'}}>
                                                <div className="detail-label">
                                                    <i className="fas fa-link"></i>
                                                    Profile
                                                </div>
                                                <a 
                                                    href={bot.profileUrl} 
                                                    target="_blank" 
                                                    className="profile-link"
                                                    rel="noopener noreferrer"
                                                >
                                                    {bot.profileUrl}
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<OnlineApp />, document.getElementById('root'));
    </script>
</body>
</html>
