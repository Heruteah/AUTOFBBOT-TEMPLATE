<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Guide - AutoFBBot</title>
    <link rel="icon" href="https://i.imgur.com/BNKq0fl.jpeg" type="image/jpeg">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .nav-btn.primary {
            background: var(--gradient);
            color: white;
        }

        .content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .page-title {
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .step {
            margin-bottom: 40px;
            padding: 25px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 15px;
            border-left: 4px solid var(--primary);
        }

        .step-number {
            display: inline-block;
            width: 35px;
            height: 35px;
            background: var(--gradient);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 35px;
            font-weight: 700;
            margin-right: 15px;
        }

        .step-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .step-content {
            color: var(--gray);
            line-height: 1.8;
            margin-left: 50px;
        }

        .step-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            display: block;
        }

        .note-box {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(245, 158, 11, 0.1));
            border-left: 4px solid #f59e0b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 40px;
        }

        .note-title {
            font-size: 20px;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .note-item {
            color: var(--gray);
            line-height: 1.8;
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }

        .note-item:before {
            content: "⚠️";
            position: absolute;
            left: 0;
        }

        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .nav-btn {
                text-align: center;
            }

            .content {
                padding: 25px;
            }

            .step-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const steps = [
            {
                number: 1,
                title: "Install Kiwi Browser",
                content: "Download and install Kiwi Browser from the Google Play Store, then launch the application.",
                image: "image/guide_1.jpeg"
            },
            {
                number: 2,
                title: "Download Extension",
                content: "Navigate to the search function and enter the following link:",
                link: "https://github.com/c3cbot/c3c-fbstate/archive/refs/tags/1.5.zip",
                image: "image/guide_2.jpeg"
            },
            {
                number: 3,
                title: "Save the File",
                content: "A download prompt will appear. Click download to save the extension file.",
                image: "image/guide_3.jpeg"
            },
            {
                number: 4,
                title: "Open Extensions",
                content: "Tap the three dots in the upper-right corner, then select 'Extensions' option.",
                image: "image/guide_4.jpeg"
            },
            {
                number: 5,
                title: "Enable Developer Mode",
                content: "In the Extensions menu, enable Developer Mode, then click the '+' button to add the extension from a zip file.",
                image: "image/guide_5.jpeg"
            },
            {
                number: 6,
                title: "Install Extension",
                content: "Locate the downloaded zip file and click on it to start the installation.",
                image: "image/guide_6.jpeg"
            },
            {
                number: 7,
                title: "Activate Extension",
                content: "Once installed, observe the C3C fbstate utility in the bottom-right corner and activate it.",
                image: "image/guide_7.jpeg"
            },
            {
                number: 8,
                title: "Login to Facebook",
                content: "Navigate to Facebook.com using Kiwi Browser and log into your account.",
                image: "image/guide_8.jpeg"
            },
            {
                number: 9,
                title: "Access C3C Utility",
                content: "Click the three dots in the upper right corner, scroll down, and locate the C3C fbstate utility.",
                image: "image/guide_9.jpeg"
            },
            {
                number: 10,
                title: "Copy Cookies",
                content: "You'll be redirected to another page. Click 'Copy Clipboard' to copy your cookies.",
                image: "image/guide_10.jpeg"
            },
            {
                number: 11,
                title: "Paste Appstate",
                content: "Return to the AutoFBBot homepage and paste your cookies in the Appstate field.",
                image: "image/guide_11.jpeg"
            },
            {
                number: 12,
                title: "Submit Form",
                content: "Review the Terms and Conditions, check the agreement box, and submit the form.",
                image: "image/guide_12.jpeg"
            },
            {
                number: 13,
                title: "Test Your Bot",
                content: "Send 'ai' to your bot to verify it's working. If it responds, congratulations! 🎉",
                image: "image/guide_13.jpeg"
            }
        ];

        const notes = [
            "If the bot encounters a login issue, it may be due to a lock. Simply unlock it and try again.",
            "While the bot is active, avoid logging into the account or changing the password.",
            "Don't log into the bot account on other devices or apps while it's running.",
            "We are not responsible for account locks or suspensions that may occur.",
            "To register another bot, logout from the current session to get a new appstate."
        ];

        function GuideApp() {
            return (
                <div className="container">
                    <header className="header">
                        <div className="logo">
                            <div className="logo-icon">
                                <i className="fas fa-book"></i>
                            </div>
                            <div className="logo-text">
                                <h1>Setup Guide</h1>
                            </div>
                        </div>
                        <nav className="nav-links">
                            <a href="/" className="nav-btn">Home</a>
                            <a href="/step_by_step_guide" className="nav-btn primary">Guide</a>
                            <a href="/online_user" className="nav-btn">Active Bots</a>
                        </nav>
                    </header>

                    <div className="content">
                        <h1 className="page-title">Step-by-Step Setup Guide</h1>

                        {steps.map((step) => (
                            <div key={step.number} className="step">
                                <div className="step-title">
                                    <span className="step-number">{step.number}</span>
                                    {step.title}
                                </div>
                                <div className="step-content">
                                    <p>{step.content}</p>
                                    {step.link && (
                                        <p style={{marginTop: '10px'}}>
                                            <a href={step.link} className="link" target="_blank">
                                                {step.link}
                                            </a>
                                        </p>
                                    )}
                                    <img 
                                        src={step.image} 
                                        alt={`Step ${step.number}`} 
                                        className="step-image"
                                        style={{maxWidth: '400px'}}
                                    />
                                </div>
                            </div>
                        ))}

                        <div className="note-box">
                            <div className="note-title">
                                <i className="fas fa-exclamation-triangle"></i>
                                Important Notes
                            </div>
                            {notes.map((note, index) => (
                                <div key={index} className="note-item">
                                    {note}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<GuideApp />, document.getElementById('root'));
    </script>
</body>
</html>
